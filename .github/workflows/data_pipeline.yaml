name: Continuous Data and Model Pipeline

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'dvc.lock'
      - 'src/sns_mlops/data.py'
      - 'src/sns_mlops/model.py'
      - 'requirements.txt'

jobs:
  repro-pipeline:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dvc[gs]
          pip install -r requirements.txt -r requirements_dev.txt
          pip install -e .

      - name: DVC Pull
        run: |
          dvc pull --remote remote_storage

      - name: Reproduce Pipeline
        run: |
          dvc repro

      - name: Run Validation Tests
        run: |
          pytest tests/test_data.py
          pytest tests/test_api.py

      - name: Push results to DVC
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        run: |
          dvc push --remote remote_storage

      - name: Check for dvc.lock changes
        id: dvc_diff
        run: |
          git diff --exit-code dvc.lock || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated dvc.lock
        if: steps.dvc_diff.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dvc.lock
          git commit -m "Auto-update dvc.lock after pipeline reproduction"
          git push